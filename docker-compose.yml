name: ogma

volumes:
  ogma_data:
    driver: local
  db_data:
    driver: local

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ogma
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3031:3031"
    environment:
      - REDIS_URL=${REDIS_URL}
      - WORKER_ML_URL=http://manga-translator:5003
      - PORT=3031
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["arq", "src.worker.WorkerSettings"]
    environment:
      - REDIS_URL=${REDIS_URL}
      - WORKER_ML_URL=http://manga-translator:5003
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - manga-translator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  manga-translator:
    image: zyddnys/manga-image-translator:main
    entrypoint: ["python"]
    command: ["server/main.py", "--host", "0.0.0.0", "--port", "5003", "--nonce", "None", "--use-gpu"]
    ports:
      - "5003:5003"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CUSTOM_OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - CUSTOM_OPENAI_API_BASE=https://openrouter.ai/api/v1
      - CUSTOM_OPENAI_MODEL=openai/gpt-4o-mini
    networks:
      - default
      - ia_networking
    volumes:
      - ./apps/api/worker/share.py:/app/manga_translator/mode/share.py
      - ./apps/api/worker/sent_data_internal.py:/app/server/sent_data_internal.py
      - ogma_data:/app/result
      - ./public/animeace.ttf:/app/fonts/Arial-Unicode-Regular.ttf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3030:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
    depends_on:
      - api
    restart: unless-stopped

networks:
  ia_networking:
    external: true
