name: ogma

volumes:
  ogma_data:
    driver: local
  paddle_cache:
    driver: local
  yolo_cache:
    driver: local

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3031:3031"
    environment:
      - REDIS_URL=${REDIS_URL}
      - WORKER_ML_URL=http://worker-ml:8000
      - PORT=3031
    volumes:
      - ogma_data:/data
    restart: unless-stopped

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["arq", "src.worker.WorkerSettings"]
    environment:
      - REDIS_URL=${REDIS_URL}
      - WORKER_ML_URL=http://worker-ml:8000
    volumes:
      - ogma_data:/data
    depends_on:
      - worker-ml
    restart: unless-stopped

  worker-ml:
    build:
      context: apps/worker-ml
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATA_DIR=/data
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral-nemo:latest}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    networks:
      - default
      - ia_networking
    volumes:
      - ogma_data:/data
      - paddle_cache:/root/.paddleocr
      - yolo_cache:/root/.config/Ultralytics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3030:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
    depends_on:
      - api
    restart: unless-stopped

networks:
  ia_networking:
    external: true
