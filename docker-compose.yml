name: ogma

volumes:
  ogma_data:
    driver: local

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3031:3031"
    environment:
      - REDIS_URL=${REDIS_URL}
      - WORKER_ML_URL=http://worker-ml:8000
      - PORT=3031
    volumes:
      - ogma_data:/data
    restart: unless-stopped

  worker-ml:
    build:
      context: apps/worker-ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
    volumes:
      - ogma_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3030:5173"
    depends_on:
      - api
    restart: unless-stopped
